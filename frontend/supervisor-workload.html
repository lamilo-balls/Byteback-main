<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Investigator Workload — ByteBack</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body style="margin:0;">
  <div id="staffShell"></div>

  <script src="js/api.js"></script>
  <script>
    const CAPACITY = 12; // reference max caseload used for the capacity guide below

    function capacityColor(total) {
      if (total >= 8) return '#d1352b';
      if (total >= 6) return '#c17d09';
      return '#16a34a';
    }

    (async () => {
      const me = await renderStaffShell({
        role: 'supervisor',
        activeHref: 'supervisor-workload.html',
        title: 'Investigator Workload',
        subtitle: 'Current case distribution across the team'
      });
      if (!me) return;

      try {
        const data = await api.supWorkload();

        document.getElementById('staffContent').innerHTML = `
          <div class="staff-table-card" style="margin-bottom:24px;">
            <h3 style="margin-bottom:20px;">Case Load by Investigator</h3>
            ${data.workload.length === 0 ? '<p style="color:#9ca3af; font-size:13px;">No investigators yet.</p>' : data.workload.map(w => `
              <div style="display:flex; align-items:center; gap:16px; margin-bottom:16px;">
                <div style="width:160px; flex-shrink:0; font-size:13px; font-weight:600; color:#1f2937;">${w.fullName}</div>
                <div style="flex:1; height:16px; background:#eef1f5; border-radius:8px; overflow:hidden;">
                  <div style="width:${Math.min(100, (w.total / CAPACITY) * 100)}%; height:100%; background:${capacityColor(w.total)};"></div>
                </div>
                <div style="width:70px; text-align:right; font-size:12.5px; color:#4c576f; font-weight:600;">${w.total} / ${CAPACITY}</div>
              </div>
            `).join('')}
          </div>

          <div class="staff-table-card">
            <h3 style="margin-bottom:16px;">Capacity Guide</h3>
            <div style="display:flex; gap:32px; flex-wrap:wrap;">
              <div style="display:flex; align-items:center; gap:8px;"><span style="width:10px; height:10px; border-radius:5px; background:#16a34a; display:inline-block;"></span><span style="font-size:12.5px; color:#4c576f;">Balanced (&lt;6 cases)</span></div>
              <div style="display:flex; align-items:center; gap:8px;"><span style="width:10px; height:10px; border-radius:5px; background:#c17d09; display:inline-block;"></span><span style="font-size:12.5px; color:#4c576f;">Near capacity (6–7 cases)</span></div>
              <div style="display:flex; align-items:center; gap:8px;"><span style="width:10px; height:10px; border-radius:5px; background:#d1352b; display:inline-block;"></span><span style="font-size:12.5px; color:#4c576f;">Overloaded (8+ cases)</span></div>
            </div>
          </div>
        `;
      } catch (e) {
        document.getElementById('staffContent').innerHTML = `<div class="error-box">${e.message}</div>`;
      }
    })();
  </script>
</body>
</html>
