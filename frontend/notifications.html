<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notifications — ByteBack</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body style="background:#f8f9fa;">
  <div id="appHeader"></div>
  <div id="staffShell"></div>

  <main class="flow-wrap" id="pageMain">
    <div class="dash-top" style="margin-bottom:16px;">
      <h1 class="flow-title" style="margin:0;">Notifications</h1>
      <button id="readAllBtn" class="link-btn" style="color:#2563eb; font-weight:600; font-size:13px;">Mark all as read</button>
    </div>

    <div class="notif-tabs">
      <button class="notif-tab active" data-tab="all">All</button>
      <button class="notif-tab" data-tab="unread">Unread</button>
    </div>

    <div class="notif-card" id="notifCard"></div>
  </main>

  <script src="js/api.js"></script>
  <script>
    let allNotifications = [];
    let activeTab = 'all';

    function timeAgo(dateStr) {
      const diffMs = Date.now() - new Date(dateStr).getTime();
      const mins = Math.floor(diffMs / 60000);
      if (mins < 1) return 'just now';
      if (mins < 60) return `${mins} minute${mins === 1 ? '' : 's'} ago`;
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return `${hrs} hour${hrs === 1 ? '' : 's'} ago`;
      const days = Math.floor(hrs / 24);
      if (days < 7) return `${days} day${days === 1 ? '' : 's'} ago`;
      const weeks = Math.floor(days / 7);
      return `${weeks} week${weeks === 1 ? '' : 's'} ago`;
    }

    function updateNotificationBadge() {
      const unreadCount = allNotifications.filter(n => !n.read).length;
      const bellLinks = document.querySelectorAll('a[href="notifications.html"], a[href="admin-notifications.html"], .staff-bell-btn');

      bellLinks.forEach(link => {
        const existingDot = link.querySelector('.app-header-dot');
        if (unreadCount > 0) {
          if (!existingDot) {
            link.insertAdjacentHTML('beforeend', '<span class="app-header-dot"></span>');
          }
        } else if (existingDot) {
          existingDot.remove();
        }
      });
    }

    function render() {
      const card = document.getElementById('notifCard');
      const list = activeTab === 'unread' ? allNotifications.filter(n => !n.read) : allNotifications;
      updateNotificationBadge();
      if (list.length === 0) {
        card.innerHTML = '<div class="empty-state">Nothing here yet.</div>';
        return;
      }
      card.innerHTML = list.map(n => `
        <div class="notif-row ${!n.read ? 'unread' : ''}" data-id="${n.id}">
          <div class="notif-icon" style="background:#eaf0ff; color:#2563eb;">✉</div>
          <div class="notif-main">
            <div class="ntitle">${n.relatedComplaint ? 'Complaint update' : 'Notification'}</div>
            <div class="nmsg">${n.message}</div>
            <div class="ntime">${timeAgo(n.createdAt)}</div>
          </div>
          ${!n.read ? '<div class="notif-dot"></div>' : ''}
        </div>
      `).join('');

      card.querySelectorAll('.notif-row.unread').forEach(row => {
        row.addEventListener('click', async () => {
          await api.markNotificationRead(row.dataset.id);
          const n = allNotifications.find(x => String(x.id) === row.dataset.id);
          if (n) n.read = true;
          render();
        });
      });
    }

    document.querySelectorAll('.notif-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        activeTab = tab.dataset.tab;
        document.querySelectorAll('.notif-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        render();
      });
    });

    document.getElementById('readAllBtn').addEventListener('click', async () => {
      await api.markAllNotificationsRead();
      allNotifications.forEach(n => n.read = true);
      render();
    });

    (async () => {
      let me;
      try {
        me = (await api.me()).user;
      } catch (e) {
        window.location.href = 'login.html';
        return;
      }

      if (me.role === 'investigator' || me.role === 'supervisor') {
        // Move the page body into the staff shell's content area so the
        // sidebar/topbar matches every other page for this role.
        const pageMain = document.getElementById('pageMain');
        await renderStaffShell({ role: me.role, activeHref: 'notifications.html', title: 'Notifications', subtitle: '' });
        document.getElementById('staffContent').appendChild(pageMain);
        pageMain.style.display = 'block';
      } else {
        await renderAppHeader('');
      }

      try {
        const data = await api.listNotifications();
        allNotifications = data.notifications;
        render();
      } catch (e) {
        document.getElementById('notifCard').innerHTML = `<div class="error-box">${e.message}</div>`;
      }
    })();
  </script>
</body>
</html>
